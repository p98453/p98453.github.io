<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人随想 · 图片预览</title>
  <!-- 在仓库根目录运行 python3 -m http.server 8000，然后打开 /scripts/thoughts-img-preview.html。 -->
  <style>
    :root { --bg: #fff; --border: #d8d8d8; --muted: #727272; --code-inline: #f7f7f7; --pre-shadow: #777; --sans: system-ui, sans-serif; --kai: serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #333; font: 16px/1.8 var(--sans); }
    main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    h1 { font: 26px serif; } h2 { font: 21px serif; }
    .thought { padding: 24px 0; border-top: 1px solid var(--border); }
    time, .hint { color: var(--muted); font-size: 14px; }
    img { max-width: 100%; height: auto; }
    /* Copied from global.css so this preview needs neither a build nor fonts. */
.thought-gallery {
  display: grid;
  gap: 18px;
  margin: 30px 0;
}

.thought-gallery--pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.thought-figure { margin: 0; min-width: 0; }

.prose .thought-figure img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 78vh;
  margin: 0;
  object-fit: contain;
  cursor: zoom-in;
  border-radius: 3px;
  background: var(--code-inline);
  box-shadow: 0 6px 18px -10px var(--pre-shadow);
}

.thought-figure img:focus-visible,
.thought-gallery button:focus-visible,
.thought-gallery__track:focus-visible,
.thought-lightbox__close:focus-visible {
  outline: 2px solid var(--muted);
  outline-offset: 3px;
}

.thought-gallery--carousel { display: block; min-width: 0; }

.thought-gallery__track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  border: 1px solid var(--border);
  border-radius: 3px;
}

.thought-gallery__track::-webkit-scrollbar { display: none; }

.thought-gallery__slide {
  flex: 0 0 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 16px;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.thought-gallery__controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin-top: 12px;
  color: var(--muted);
  font: 14px var(--sans);
  font-variant-numeric: tabular-nums;
}

.thought-gallery__controls button,
.thought-lightbox__close {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  font: 20px var(--sans);
  cursor: pointer;
}

.thought-gallery__controls button:disabled { opacity: 0.3; cursor: default; }

.thought-lightbox {
  position: fixed;
  inset: 0;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  color: var(--muted);
  background: var(--bg);
}

.thought-lightbox::backdrop { background: rgb(0 0 0 / 0.2); }

.thought-lightbox__close {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 1;
}

.thought-lightbox__scroll {
  height: 100%;
  box-sizing: border-box;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 72px 24px 32px;
}

.thought-lightbox__scroll img {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  max-height: none;
  margin: 0 auto;
}

.thought-figure figcaption {
  margin-top: 10px;
  color: var(--muted);
  font-family: var(--kai);
  font-size: 15px;
  text-align: center;
  letter-spacing: 0.08em;
}

@media (max-width: 560px) {
  .thought-gallery--pair { grid-template-columns: 1fr; gap: 26px; }
}

  </style>
</head>
<body>
  <main>
    <h1>个人随想 · 图片预览</h1>
    <p class="hint">点击看完整图片；轮播可用箭头或触屏滑动。Esc / 点击空白关闭大图。</p>
    <article class="thought"><time>2026年11月5日</time><h2>一张很长的聊天截图</h2><div id="long" class="prose"></div></article>
    <article class="thought"><time>2026年11月5日</time><h2>四张日常片段</h2><div id="carousel" class="prose"></div></article>
  </main>
  <script type="module">
    import { renderMarkdown, enhanceThoughtImages } from '../src/scripts/thoughts-client.js';
    function sample(label, color, height = 600) {
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 400, height);
      ctx.font = '22px sans-serif';
      for (let y = 0; y < height; y += 200) {
        ctx.fillStyle = y % 400 ? '#ffffff' : '#f4f1eb';
        ctx.fillRect(20, y + 20, 360, 156);
        ctx.fillStyle = '#444';
        ctx.fillText(`${label} · ${y / 200 + 1}`, 40, y + 74);
        ctx.fillText(y + 200 >= height ? '图片底部 / END' : '生活里的一个片段', 40, y + 120);
      }
      return canvas.toDataURL('image/png');
    }
    function renderSample(id, samples) {
      const root = document.getElementById(id);
      // Use allowed placeholder URLs for Markdown, then replace them locally.
      // Production imageSrc filtering is deliberately kept unchanged.
      root.innerHTML = renderMarkdown(samples.map((_, i) => `![片段 ${i + 1}](https://preview.invalid/${i}.png)`).join('\n'));
      root.querySelectorAll('img').forEach((img, i) => { img.src = samples[i]; });
      enhanceThoughtImages(root);
    }
    renderSample('long', [sample('长图', '#e2ddd3', 1600)]);
    renderSample('carousel', [sample('一', '#d9e5df'), sample('二', '#e5ded3'), sample('三', '#dce2ed', 1600), sample('四', '#e9dce1')]);
  </script>
</body>
</html>
